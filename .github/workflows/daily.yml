# Daily briefing. 00:00 UTC = 05:30 IST.
# GitHub only lists a workflow after it parses cleanly; this file avoids the
# `inputs` context (unreliable on schedule-only workflows) so it actually appears.
name: Daily edition

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run — stop after the quality gate (no LLM, no commit)
        type: boolean
        default: false
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Guard - API key must exist for a real run
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set; refusing to run the LLM stage."
            exit 1
          fi

      - name: Dry run (feeds of the day, no LLM, no commit)
        if: ${{ env.DRY_RUN == 'true' }}
        run: uv run python -m pipeline run --date today --no-llm

      - name: Build today's edition
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python -m pipeline run --date today

      - name: Commit edition and memory
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          git config user.name "briefing-bot"
          git config user.email "actions@github.com"
          git add data/editions data/memory
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "Edition: $(date -u +%F)"
            git push
          fi
