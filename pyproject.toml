[project]
name = "ai-news-agent"
version = "0.1.0"
description = "Daily AI/tech news briefing: RSS ingest, quality gate, LLM edition, static site"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "google-genai>=2.19.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "python-dateutil>=2.9.0.post0",
    "rapidfuzz>=3.14.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: tests that hit the live internet (excluded in CI)",
    "llm: tests that call the real Gemini API (excluded in CI)",
]
addopts = "-m 'not network and not llm'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
